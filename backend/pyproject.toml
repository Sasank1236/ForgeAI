[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "forgeai-backend"
version = "0.1.0"
description = "ForgeAI — Repository-Aware AI Coding Assistant Backend"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # ─── Web Framework ───────────────────────────────────────────────────────
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",

    # ─── Database ────────────────────────────────────────────────────────────
    "sqlalchemy[asyncio]>=2.0.35",
    "alembic>=1.13.0",
    "asyncpg>=0.29.0",
    "pgvector>=0.3.0",

    # ─── Configuration ───────────────────────────────────────────────────────
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "python-dotenv>=1.0.0",

    # ─── Cache ───────────────────────────────────────────────────────────────
    "redis[asyncio]>=5.0.0",

    # ─── HTTP ────────────────────────────────────────────────────────────────
    "httpx>=0.27.0",

    # ─── LLM & Embeddings ────────────────────────────────────────────────────
    "litellm>=1.44.0,<1.60.0",
    "openai>=1.40.0",
    "tiktoken>=0.7.0",

    # ─── Repository Parsing ──────────────────────────────────────────────────
    "tree-sitter>=0.23.0",
    "tree-sitter-python>=0.23.0",
    "tree-sitter-javascript>=0.23.0",
    "tree-sitter-typescript>=0.23.0",
    "tree-sitter-go>=0.23.0",
    "tree-sitter-rust>=0.23.0",
    "tree-sitter-java>=0.23.0",

    # ─── Logging ─────────────────────────────────────────────────────────────
    "structlog>=24.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
    "types-redis>=4.6.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/forgeai"]

# ─── Ruff ─────────────────────────────────────────────────────────────────────
[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4"]
ignore = ["B008"]  # FastAPI uses function calls as default args (Depends)

[tool.ruff.lint.isort]
known-first-party = ["forgeai"]

# ─── mypy ─────────────────────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

# ─── pytest ───────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--cov=src/forgeai --cov-report=term-missing"
